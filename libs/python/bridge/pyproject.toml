[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "cua-bridge"
version = "0.1.0"
description = "MCP tool bridge exposing CUA environments to external agents"
authors = [
    { name = "TryCua", email = "gh@trycua.com" }
]
dependencies = [
    "cua-env>=0.1.0",
    "fastmcp>=2.0.0",
    "uvicorn>=0.27.0",
]
requires-python = ">=3.12,<3.14"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["bridge/"]
